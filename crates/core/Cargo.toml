[package]
name = "vector-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client-side helpers for building Vector program instructions"

[dependencies]
# The program itself, as a library: its ID, header, discriminators and each
# scheme's stored identity.
vector = { path = "../../programs/vector", features = ["no-entrypoint"] }
pinocchio = { workspace = true }
solana-address = { workspace = true, features = ["curve25519", "decode"] }
solana-instruction = { workspace = true }
solana-instructions-sysvar = "3.0.0"
ed25519-dalek = "=2.1.1"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[dev-dependencies]
# Falcon signer for the verify round-trip tests (already in the workspace
# tree via `vector-tests`; the program's Falcon-512 is verify-only).
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3"
