[package]
name = "vector-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client-side SDK for the Vector Solana programs"

[features]
default = ["ed25519", "secp256k1", "eip191"]
ed25519 = ["dep:ed25519-dalek"]
secp256k1 = ["dep:k256"]
eip191 = ["dep:k256", "dep:sha3"]
falcon512 = ["dep:pqcrypto-falcon", "dep:pqcrypto-traits", "dep:solana-falcon512"]
hawk512 = ["dep:hawk512", "dep:solana-hawk512"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-address = { workspace = true, features = ["curve25519", "decode"] }
solana-instruction = { workspace = true }
solana-instructions-sysvar = "3.0.0"
solana-falcon512 = { workspace = true, optional = true }
sha2 = "0.10"
ed25519-dalek = { version = "=2.1.1", optional = true }
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
sha3 = { version = "0.10", optional = true }
pqcrypto-falcon = { version = "0.4", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }
hawk512 = { version = "0.1.0", optional = true }
solana-hawk512 = { workspace = true, optional = true }
