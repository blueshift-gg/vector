[package]
name = "vector-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Vector: inspect, verify, and relay artifacts"

[[bin]]
name = "vector"
path = "src/main.rs"

[dependencies]
vector-core = { path = "../core", features = ["ed25519", "secp256k1", "eip191", "falcon512", "hawk512"] }
vector-client = { path = "../client" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
