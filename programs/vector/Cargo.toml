[package]
name = "vector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vector — the signing program, one binary for every scheme"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = { workspace = true, features = ["account-resize", "cpi"] }
pinocchio-system = { workspace = true, features = ["account-resize"] }
solana-address = { workspace = true, features = ["curve25519"] }
brine-ed25519 = { workspace = true }
solana-falcon512 = { workspace = true }
solana-ml-dsa = { workspace = true }
solana-nostd-keccak = { workspace = true }
solana-nostd-sha256 = { workspace = true }
solana-secp256k1 = { workspace = true }
solana-secp256k1-ecdsa = { workspace = true }
solana-winternitz = { workspace = true }

[lints]
workspace = true

# Off chain, `sol_secp256k1_recover` as the runtime runs it, so the client's
# offline check is the program's own.
[target.'cfg(not(target_os = "solana"))'.dependencies]
libsecp256k1 = { version = "0.7.2", default-features = false, features = ["static-context"] }
