[package]
name = "vector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vector — the signing program, one binary for every scheme"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = { workspace = true, features = ["account-resize", "cpi"] }
pinocchio-system = { workspace = true, features = ["account-resize"] }
solana-address = { workspace = true, features = ["curve25519"] }
solana-nostd-sha256 = { workspace = true }
# The schemes, the account layout and the instruction format.
vector-signer = { path = "../../crates/core", default-features = false }

[lints]
workspace = true
